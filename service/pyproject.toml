[project]
name = "jarvis-workos"
version = "0.1.0"
description = "Jarvis: an executive AI companion service for Omarchy (portable to Windows for development)"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.50",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Local speech (wake word, VAD, Whisper, Piper), versions as pinned by Hey Jarvis 2.4.0.
# omarchy/install.sh installs these from Hey Jarvis's hash-locked requirements.lock instead.
local = ["openwakeword==0.6.0", "faster-whisper==1.2.1", "piper-tts==1.4.2", "onnxruntime==1.24.4", "numpy"]
# The voice engine (jarvis/engine). omarchy/install.sh installs it from omarchy/locks/pipecat.lock
# (hash-locked); without it jarvisd falls back to the legacy voice runtime.
pipecat = ["pipecat-ai==1.13.0", "google-genai>=2.25,<3"]
# Office/PDF tools (jarvis/capabilities/documents.py); omarchy/install.sh installs omarchy/locks/documents.lock.
documents = ["python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2", "pypdf==6.21.1", "fpdf2==2.8.9"]
# Only needed off Linux; on Omarchy audio goes through PipeWire's pw-record/pw-play.
windows = ["sounddevice>=0.5", "numpy", "tzdata"]
dev = ["pytest>=8"]

[project.scripts]
jarvis-workos = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
# The Living Workspace's page, scripts, styles and vendored three.js.
"jarvis.workspace" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
