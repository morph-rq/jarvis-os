# SearXNG settings for Jarvis's research engine (Morphic). `jarvis-workos research setup` copies this to
# ~/.config/jarvis-workos/searxng/settings.yml with a generated secret_key; edit that copy, not this file.
# Everything not set here is SearXNG's own default (use_default_settings).
use_default_settings:
  engines:
    # The engines Jarvis asks for by name (see service/jarvis/research/engines.py); the rest are not loaded,
    # which keeps memory and start-up time down.
    keep_only:
      - duckduckgo
      - duckduckgo news
      - brave
      - brave.news
      - startpage
      - startpage news
      - mojeek
      - mojeek news
      - wikipedia
      - wikidata
      - google
      - google news
      - bing
      - bing news
      - yandex
      - qwant
      - qwant news
      - duckduckgo images
      - brave.images
      - startpage images
      - bing images
      - currency

general:
  instance_name: "Jarvis research (local)"
  enable_metrics: true          # per-engine errors and timings: Jarvis reads them for failover

search:
  safe_search: 0
  autocomplete: ""              # nothing is sent while typing
  default_lang: "auto"
  formats: [html, json]         # json is what Jarvis reads
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

server:
  bind_address: "127.0.0.1"     # loopback only: never reachable from the network
  port: 18890
  secret_key: "@JARVIS_SECRET@"
  limiter: false                # one local user; the limiter is for public instances
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 2.5          # per engine (Jarvis asks engines in parallel and stops waiting earlier)
  max_request_timeout: 6.0
  pool_connections: 40
  pool_maxsize: 8
  enable_http2: true

valkey:
  url: false

engines:
  # Off in SearXNG's defaults (they often answer scrapers with a CAPTCHA); loaded so Jarvis can ask for them
  # by name as a fallback, never by default.
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: yandex
    disabled: true              # used for Russian and Kazakh queries
  - name: qwant
    disabled: true
