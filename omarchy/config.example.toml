# Jarvis WorkOS settings. Change them with `jarvis-workos config set KEY VALUE` (validated) or the
# panel's Settings. API keys never go here: they live in the keyring or secrets.env (mode 600).

[voice]
engine = "live"                # "live" (Gemini Live) or "local" (Whisper + Piper, offline)
runtime = "pipecat"            # pipecat (both engines as Pipecat pipelines) | legacy (previous implementation)
voice = "Charon"
barge_in = "gated"             # gated | open (with --echo-cancel or headphones) | off

[local]
turn_detection = "smart"       # smart (Silero VAD + Smart Turn v3) | silence (fixed pause)
# whisper_device = "auto"      # auto picks CUDA on an NVIDIA GPU (e.g. RTX 5090) when CUDA 12 libraries are present

[vision]
live_delivery = "describe"     # screen questions in Live: describe | context | realtime
continuous = false             # stream the screen into Live conversations (privacy: off by default)

[wake]
enabled = true
threshold = 0.5                # lower = more sensitive

[ui]
language = "auto"              # auto | ru | en | pt
hud = true                     # floating cards, notices and approvals at the screen edge
companion_style = "jarvis"     # jarvis (GPU orb with eyes) | pebble (eyes) | orb (rings and glow)
island = true                  # the Jarvis Island at the top centre (Super+Alt+I)
island_autohide = false        # idle: shrink to a thin strip until hovered
island_screen = "focused"      # focused | primary
island_quiet = false           # do not disturb: only approvals, calls and agent questions open it
reduced_motion = false         # calmer, shorter animations

# ---- capabilities (docs/CAPABILITIES.md) ----

[web]
city = ""                      # home city for weather and the briefing (or say "remember I live in ...")

[proactive]
enabled = true
max_per_hour = 4
quiet_hours = "23:00-08:00"    # only urgent notices, silent
breaks = false                 # suggest a break after 90 min of uninterrupted work
clipboard = false              # notice copied errors (classified locally, never uploaded)

[skills]
code_skills = true             # Python skills run only in a bubblewrap sandbox, after you approve their code

# [home]
# url = "http://homeassistant.local:8123"     # token: secret-tool store --label="Jarvis HA" service jarvis-workos key HOME_ASSISTANT_TOKEN

# [mail]
# address = "you@example.com"                 # app password: ... key MAIL_PASSWORD
# imap_host = "imap.gmail.com"
# smtp_host = "smtp.gmail.com"

# [messaging]
# telegram_chats = { "Мама" = 123456789 }     # bot token: ... key TELEGRAM_BOT_TOKEN; Jarvis may message only these chats

# ---- messaging gateway: chat with Jarvis from your phone (docs/MESSAGING.md) ----
# Set up from the panel (Settings → Messaging) or: jarvis-workos gateway connect telegram, then gateway pair.
# Bot tokens go to the keyring, never here.

[gateway]
enabled = true
dm_policy = "pairing"          # pairing: strangers get a code you approve on this computer | allowlist: strangers ignored | disabled
groups = false                 # group chats: only paired people, only when they mention the bot
rate_per_minute = 12           # per person
max_file_mb = 20
forward_notices = true         # reminders, finished background jobs and notices also go to your chats
forward_approvals = false      # also send approvals asked on the desktop to your phone
voice_replies = false          # answer voice notes with a voice note (needs piper + ffmpeg)
# signal_account = "+15550001111"   # set by "Link device"; signal-cli must be installed
# whatsapp_phone_id = "1234567890"  # WhatsApp Cloud API; webhook on 127.0.0.1:47615, exposed with a tunnel
# calls = true                      # WhatsApp voice calls (docs/CALLING.md); turned on by "Enable calls" in the panel
# call_max_minutes = 15             # each call ends after this

# ---- connected apps and the Living Workspace (docs/INTEGRATIONS.md) ----

[integrations]
auto_drafts = true             # saving a private email draft runs without asking (sending always asks)
google_fallback_composio = false   # Google apps through Composio only if the Google connector is unavailable
download_dir = "~/Downloads/Jarvis"   # attachments and Drive downloads land here
# Google Workspace (workspace-mcp, installed by install.sh). Needs your own OAuth "Desktop app" client:
#   jarvis-workos secret set GOOGLE_OAUTH_CLIENT_ID   and   GOOGLE_OAUTH_CLIENT_SECRET
# permissions = the only scopes requested (service:level; gmail: readonly < organize < drafts < send < full).
# google = { permissions = ["gmail:send", "calendar:full", "drive:readonly", "docs:full", "sheets:full", "slides:full", "contacts:readonly", "tasks:manage"] }
# Composio (Slack, Notion, Trello, GitHub, CRMs…): jarvis-workos secret set COMPOSIO_API_KEY
# composio = { toolkits = [], blocked = ["discord"] }   # toolkits: allow-list (empty = any)

[workspace]
enabled = true                 # Super+Alt+W or "открой рабочее пространство"
offline = true                 # the workspace window gets no internet at all
generated_ui = true            # interactive views written by the model, run in a sandbox

[browser]
# Jarvis's own browser window for web tasks (its own profile, never your everyday one).
# binary = "/usr/bin/chromium"   # default: chromium, google-chrome or brave, whichever is installed
# headless = false

# ---- OpenClaw and Hermes behind Jarvis (docs/AGENT-BACKENDS.md; installed by install-jarvis.sh) ----
# Both listen on 127.0.0.1 only; their token/key live in the keyring (made by Jarvis, never in a config file).
# manage: auto (the user service when installed, else jarvisd runs it), systemd, child, external, off.
# [openclaw]
# enabled = true
# manage = "auto"
# model = "google/gemini-3.5-flash"     # used only when OpenClaw has no model of its own
# model_keys = ["GEMINI_API_KEY"]       # which of Jarvis's keys OpenClaw may use
# state_dir = ""                        # "" = ~/.openclaw, its sessions and skills stay as they are
#
# [hermes]
# enabled = true
# manage = "auto"
# model = "gemini/gemini-3.5-flash"
# model_keys = ["GEMINI_API_KEY"]
# home = ""                             # "" = ~/.hermes, its memory and skills stay as they are
# # What Hermes may use when Jarvis delegates. Add "terminal" only if you want it; risky commands still ask you.
# toolsets = ["web", "file", "skills", "todo", "memory", "session_search"]
#
# [catalog]
# sync_hours = 12                       # look at ClawHub for new skills (nothing is installed by looking)
# update_check_hours = 24
# auto_update_skills = "trusted"        # "off": always ask; "trusted": only skills you trust, clean, asking for nothing new
# auto_update_plugins = "off"
# trusted = []                          # e.g. ["pdf-tools"]
