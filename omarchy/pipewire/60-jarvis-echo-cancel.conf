# Echo-cancelled microphone for Jarvis, so speaker playback does not interrupt it.
# Installed by `install.sh --echo-cancel`; Jarvis records from "jarvis-echo-cancel-source".
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      node.latency = 1024/48000
      monitor.mode = true
      capture.props = { node.name = "jarvis-echo-cancel-capture" node.passive = true }
      source.props = { node.name = "jarvis-echo-cancel-source" node.description = "Jarvis echo-cancelled mic" }
      sink.props = { node.name = "jarvis-echo-cancel-sink" node.passive = true }
      playback.props = { node.name = "jarvis-echo-cancel-playback" node.passive = true }
    }
  }
]
